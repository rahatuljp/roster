<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リスト</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      color: #333;
      line-height: 1.6;
      margin: 16px;
      padding: 0;
    }
    h1 {
      font-size: 22px;
      color: #0056b3;
      text-align: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-top: 10px;
    }

    .container {
      display: flex;
      gap: 16px;
      justify-content: flex-start;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    table {
      width: 100%;
      max-width: 320px;
      border-collapse: collapse;
      margin: 0;
    }

    td {
      border: 5px solid #301546;
      padding: 0;
      background-color: #301546;
      text-align: left;
      color: #000108;
    }

    .furikyu-list {
      display: block;
      background: #5fcfa9;
      padding: 16px 14px;
      border-radius: 8px;
      font-size: 18px;
      line-height: 3.74;
      width: 100%;
    }

    .list {
      display: block;
      background: #5fcfa9;
      padding: 16px 13px;
      border-radius: 8px;
      font-size: 16px;
      line-height: 3.5;
      width: 100%;
    }

    .salary {
      display: block;
      background: #f5faf8;
      padding: 14px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 2.2;
      width: 100%;
    }

    .salary .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .salary .label {
      flex: 1;
    }

    .salary .value {
      font-weight: 500;
      text-align: right;
      min-width: 110px;
    }

    .salary .divider {
      border-top: 1px dashed #2a7a5a;
      margin: 8px 0;
    }

    .salary .total {
      font-weight: bold;
    }

    .salary .grand-total {
      font-weight: bold;
      font-size: 16px;
      color: #004d33;
      background: #b8f0d8;
      padding: 6px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }

    .marquee {
      color: #32497d;
      font-weight: bold;
      margin-top: 24px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h1>ノート</h1>

  <div class="container">

    <!-- everyday -->
    <table>
      <tr>
        <td>
          <span class="list">
            12月　フェリーの予約番号<br>
            3日 宇久島7:00 発 ➡10:20 着 139番<br>
            6日 佐世保17:05 発 ➡20:25 着 109番<br>
            26日 宇久島7:00 発 ➡10:20 着 150番<br>
            ありがとう、宇久島。たくさんの思い出を胸に、新しい一歩へ。
          </span>
        </td>
      </tr>
    </table>

    <!-- furikyu-list -->
    <table>
      <tr>
        <td>
          <span class="furikyu-list">
            2026年<br>
            振休まだ使ってない 5日<br>
            9月➡ 5日, 26日<br>
            10月➡ 3日, 10日, 31日<br>
            12月➡
          </span>
        </td>
      </tr>
    </table>

    <!-- salary (read-only) -->


  </div>

  <marquee behavior="" direction="left" class="marquee">This Data will be updated manually.</marquee>

</body>
</html>
