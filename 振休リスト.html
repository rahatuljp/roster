<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>振休リスト</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      color: #333;
      line-height: 1.6;
      
    }
    h1 {
      font-size: 22px;
      color: #0056b3;
      text-align: center;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 10px;
      margin-top: 10px;
    }
    table {
      width: 100%;
      max-width: 300px;
      border-collapse: collapse;
      margin: auto 20px;
    }
    th, td {
      border: 12px solid #301546;
      padding: 12px;
      text-align: left;
      color: #000108;
    }
    th {
      background-color: #1c2472;
      width: 25%;
    }

    /* Green background behind the text only */
    .furikyu-list {
      display: inline-block;
      background: #5fcfa9;
      padding: 20px 12px;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1.7;
      width: 100%;
    }
    .marquee {
      color: #32497d;
      font-weight: bold;
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>振休リスト</h1>

  <table>
    <tr>
      <td>
        <span class="furikyu-list">
          2026年<br>
          振休まだ使ってない 10日<br>
          9月➡ 5日，26日<br>
          10月➡3日，10日，31日<br>
          11月➡7日，21日，28日<br>
          12月➡12日，19日
        </span>
      </td>
    </tr>
  </table>

  <marquee behavior="" direction="left" class="marquee">This Data will be updated manually.</marquee>

</body>
</html>
